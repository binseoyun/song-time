version: "3.9"

services:
  db:
  # ★ [수정 1] 공식 이미지 대신 Dockerfile로 빌드
    build:
      context: ./database
      dockerfile: Dockerfile
    image: my-database:v1  # ★ [수정 2] K8s와 똑같은 이름표 붙이기
    #image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend API 서버를 2 replica로 분리한다(doc/troubleshooting/05 2순위) — Node는
  # 이벤트 루프 하나라 CPU 바운드 구간(JWT 검증 등)이 단일 인스턴스로는 순차 처리될
  # 수밖에 없어, nginx 커넥션 튜닝(1순위)만으로는 VUS=3,000급 순간 부하에서
  # request timeout이 남았다. `--scale` 대신 명시적으로 서비스를 2개 나눈 이유는
  # RabbitMQ 워커(worker_1/worker_2)와 같다 — 오픈소스 nginx의 정적 upstream은
  # 시작 시 DNS를 한 번만 resolve해서, `--scale`로 띄운 레플리카끼리는 실제로
  # 부하분산이 안 될 수 있다(nginx가 그중 하나만 계속 쓰게 됨).
  #
  # seedData.js(과목 마스터 데이터 시딩)는 findOrCreate 기반이라 완전히 동시성
  # 안전하지 않다 — 두 인스턴스가 동시에 실행하면 이 프로젝트가 이번 세션 내내
  # 다뤄온 것과 같은 종류의 레이스가 생길 수 있어, backend_1만 시딩을 맡는다.
  #
  # 호스트 포트(8080:8000) 직접 노출은 뺐다 — 컨테이너 2개를 같은 호스트 포트에
  # 매핑할 수 없어서 이 시점에 정리가 필요했고, nginx(8090)가 이미 same-origin으로
  # /api를 전부 프록시하므로(ADR-003) 직접 노출은 이슈 #31이 지적한 우회로일
  # 뿐이었다 — 이 변경으로 그 문제가 자연히 함께 해소된다.
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      AI_SERVER_URL: http://ai-server:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq
      # 실험 02 Step 3(Valve Tuning, 이슈 #57)이 라운드마다 바꿔가며 재기동한다.
      # 미지정 시 queueService.js의 코드 기본값(300/600)과 동일하게 맞춘다.
      ACTIVE_GATE_LIMIT: ${ACTIVE_GATE_LIMIT:-300}
      ACTIVE_TTL_SECONDS: ${ACTIVE_TTL_SECONDS:-600}
    command: sh -c "node src/seedData.js && node src/server.js"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      AI_SERVER_URL: http://ai-server:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq
      ACTIVE_GATE_LIMIT: ${ACTIVE_GATE_LIMIT:-300}
      ACTIVE_TTL_SECONDS: ${ACTIVE_TTL_SECONDS:-600}
    command: node src/server.js
    depends_on:
      db:
        condition: service_healthy
      backend_1:
        condition: service_started
    restart: unless-stopped

  # backend_3/backend_4: 이슈 #57 Round 1(VUS=12,000)에서 backend_1/backend_2가 각각
  # CPU 110~116%(프로세스당 천장)로 포화됐는데도 VM 전체 CPU는 최대 83%로 여유가
  # 있었음을 확인 — 대기열 폴링 총량을 받아낼 처리 용량을 인스턴스 추가로 넓혀
  # 이 가설을 검증한다. backend_2와 동일하게 seedData.js는 실행하지 않는다
  # (findOrCreate 기반이라 동시 실행 시 레이스 위험 — backend_1만 시딩 전담).
  backend_3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      AI_SERVER_URL: http://ai-server:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq
      ACTIVE_GATE_LIMIT: ${ACTIVE_GATE_LIMIT:-300}
      ACTIVE_TTL_SECONDS: ${ACTIVE_TTL_SECONDS:-600}
    command: node src/server.js
    depends_on:
      db:
        condition: service_healthy
      backend_1:
        condition: service_started
    restart: unless-stopped

  backend_4:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      AI_SERVER_URL: http://ai-server:5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq
      ACTIVE_GATE_LIMIT: ${ACTIVE_GATE_LIMIT:-300}
      ACTIVE_TTL_SECONDS: ${ACTIVE_TTL_SECONDS:-600}
    command: node src/server.js
    depends_on:
      db:
        condition: service_healthy
      backend_1:
        condition: service_started
    restart: unless-stopped

  # Group C(Redis 원자적 연산)의 좌석/신청/시간표 카운터. AOF/RDB 영속화는 끈다 —
  # 지금 계획된 카오스 시나리오는 워커/API 서버 kill이지 Redis 재시작이 아니고,
  # 재시작 시 데이터는 seedRedisRegistrations.js로 다시 채운다
  # (doc/portfolio/01-group-c-redis-설계-결정.md 참고).
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Group C 비동기 영속화용 브로커. registration.persist / registration.persist.dlq
  # 큐는 backend/src/config/rabbitmq.js의 connect()가 기동 시 자동으로 assert한다.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI (게스트/게스트 기본 계정, 로컬 전용)
    restart: unless-stopped

  # RabbitMQ 워커 2개(worker_1/worker_2)를 별도 서비스로 명시한다 — 카오스 테스트(1-8)에서
  # "워커 하나만 골라서 죽이고 나머지가 계속 처리하는지"를 이름으로 재현 가능하게 확인해야
  # 하기 때문에, `--scale` 대신 이 방식을 선택했다
  # (doc/portfolio/01-group-c-redis-설계-결정.md 참고).
  worker_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq
    command: node src/worker.js
    depends_on:
      db:
        condition: service_healthy
      backend_1:
        condition: service_started
    restart: unless-stopped

  worker_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq
    command: node src/worker.js
    depends_on:
      db:
        condition: service_healthy
      backend_1:
        condition: service_started
    restart: unless-stopped

  # AI 챗봇 작업 메모리(최근 N턴, TTL) — ai-server 전용. 기존 Group C `redis`(대기열/좌석
  # 카운터, 지연 민감 워크로드)와 인스턴스·접속 주체 모두 분리한다 — 두 워크로드 성격이
  # 전혀 달라(noisy neighbor 리스크) 같이 쓸 이유가 없고, "각 서비스가 자체 데이터스토어를
  # 소유"하는 MSA 원칙을 접속 주체까지 끝까지 적용한다(ADR-010 §3/§10 재검토).
  # 채팅은 재시작으로 캐시가 비어도 MySQL(db-chat)이 소스오브트루스라 정보 손실이 없어
  # AOF/RDB 영속화는 기존 redis와 동일하게 끈다.
  redis-chat:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  # AI 챗봇 영구 대화 이력(chat_sessions/chat_messages) — ai-server가 직접 소유하고
  # Alembic으로 스키마를 관리한다. 기존 `db`(Users/Classes/Registration)와 물리적으로도
  # 스키마상으로도 완전히 분리되며, `db`처럼 커스텀 Dockerfile이 아니라 공식 mysql:8.0
  # 이미지를 그대로 쓴다(ADR-010 §3/§10 재검토).
  db-chat:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.chat.docker
    ports:
      - "3311:3306"
    volumes:
      - db_chat_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-server:
    build:
      context: ./backend/ai-server
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      - .env.chat.docker
    depends_on:
      backend_1:
        condition: service_started
      db-chat:
        condition: service_healthy
      redis-chat:
        condition: service_started
    # 호스트 포트 직접 노출 제거(ADR-010 §11, 이슈 #31/#83) — 정상 경로가 전부
    # nginx→Node를 거치므로(인증·rate limit), 이 포트가 열려 있으면 인증을 우회해
    # Gemini 토큰 비용을 유발시킬 수 있는 표면만 남는다. ai-server는 Docker 내부망에서만
    # 접근 가능하고, 이 격리가 x-user-id 신뢰 헤더 방식의 보안 전제이기도 하다.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/Course Registration Platform
      dockerfile: Dockerfile
    depends_on:
      - backend_1
    ports:
      - "3001:3000"
    restart: unless-stopped

  # ADR-003: frontend가 상대경로(/api/...)만 쓰므로, frontend/backend/ai-server를
  # 하나의 origin으로 묶어주는 역할. K8s의 Ingress와 같은 역할을 docker-compose에서 담당.
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend_1
      - backend_2
      - backend_3
      - backend_4
      - ai-server
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  db_data:
  db_chat_data:

