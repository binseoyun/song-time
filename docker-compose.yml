version: "3.9"

services:
  db:
  # ★ [수정 1] 공식 이미지 대신 Dockerfile로 빌드
    build:
      context: ./database
      dockerfile: Dockerfile
    image: my-database:v1  # ★ [수정 2] K8s와 똑같은 이름표 붙이기
    #image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./database/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      AI_SERVER_URL: http://ai-server:5000
    command: sh -c "node src/seedData.js && node src/server.js"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8000"
    restart: unless-stopped

  ai-server:
    build:
      context: ./backend/ai-server
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      - backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/Course Registration Platform
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3001:3000"
    restart: unless-stopped

  # ADR-003: frontend가 상대경로(/api/...)만 쓰므로, frontend/backend/ai-server를
  # 하나의 origin으로 묶어주는 역할. K8s의 Ingress와 같은 역할을 docker-compose에서 담당.
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-server
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  db_data:

