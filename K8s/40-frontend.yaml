apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: sugang-system
spec:
  # ADR-003: 외부 접속은 Ingress 하나로 통일 → 개별 서비스는 클러스터 내부에서만 필요(ClusterIP)
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sugang-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # ADR-003: frontend는 상대경로(/api/...)만 쓰므로 환경변수 주입 자체가 불필요해짐
        image: binseoyun/frontend:v7
        imagePullPolicy: Always # ✅ K8s가 Docker Hub에서 이미지를 가져오도록 Always로 변경
        ports:
        - containerPort: 3000