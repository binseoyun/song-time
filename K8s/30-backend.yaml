apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: sugang-system
spec:
  # ADR-003: 외부 접속은 Ingress 하나로 통일 → 개별 서비스는 클러스터 내부에서만 필요(ClusterIP)
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sugang-system
spec:
  replicas: 2 # 부하 분산을 위해 2개 실행
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: binseoyun/backend:v4
        imagePullPolicy: Always # ✅ K8s가 Docker Hub에서 이미지를 가져오도록 Always로 변경
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2

        env:
        # DB 연결 정보 (ConfigMap이나 Secret에서 가져오는 방식도 좋지만, 직관적으로 적어둠)
        - name: DB_HOST
          value: "db-service" # 10-db.yaml에서 만든 서비스 이름
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-password
        - name: DB_NAME
          value: "cloudsystem_db"
        # AI 서버 연결 정보 (서비스 이름으로 호출)
        - name: AI_SERVER_URL
          value: "http://ai-server-service:5000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        - name: CRON_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: cron-secret