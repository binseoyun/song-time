version: "3.9"

# Stage 0 (이슈 #13) 부하테스트 도구 모음. 기본 스택(docker-compose.yml) 위에 얹어서 쓴다.
# backend 서비스에 볼륨을 덧붙이므로(21-23행) 기본 스택도 반드시 이 파일과 함께 올려야 한다.
#
# 사용법 (프로젝트 루트에서):
#   0) 전체 스택 기동 (최초 1회 또는 재기동 시)
#      docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
#      Grafana: http://localhost:3300 (익명 Admin 접속, 로그인 불필요)
#
#   1) 계정 시딩 + 실험 대상 과목 초기화 (매 회차 전 반드시 재실행 — 실험계획서 01 7장)
#      docker compose -f docker-compose.yml -f docker-compose.loadtest.yml exec backend \
#        node scripts/seedLoadTestAccounts.js
#
#   2) k6 실행 (그룹/동시성 수준별로 반복 실행)
#      docker compose -f docker-compose.yml -f docker-compose.loadtest.yml run --rm \
#        -e TARGET_PATH=/api/registrations/naive -e VUS=500 k6

services:
  # 기본 스택(docker-compose.yml)의 backend 서비스에 볼륨만 덧붙인다.
  # seedLoadTestAccounts.js가 여기 쓴 토큰 파일(/loadtest/generated/tokens.json)을
  # k6 컨테이너가 동일 호스트 경로 마운트로 읽는다.
  backend:
    volumes:
      - ./loadtest/generated:/loadtest/generated

  prometheus:
    image: prom/prometheus:v2.53.0
    # --web.enable-remote-write-receiver: k6가 --out experimental-prometheus-rw로
    # 직접 push하므로 receiver를 켜야 한다 (loadtest/prometheus.yml 상단 주석 참고).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./loadtest/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # 로컬 1인 개발 도구이므로 익명 Admin 접속으로 로그인 절차를 생략한다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./loadtest/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    ports:
      - "3300:3000"
    restart: unless-stopped

  k6:
    image: grafana/k6:0.52.0
    volumes:
      - ./loadtest/scripts:/scripts:ro
      - ./loadtest/generated:/loadtest/generated:ro
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      TARGET_BASE_URL: http://nginx
      TARGET_PATH: /api/registrations/naive
      CLASS_ID: 21001083-2
      TOKENS_FILE: /loadtest/generated/tokens.json
    entrypoint: ["k6"]
    command: ["run", "--out", "experimental-prometheus-rw", "/scripts/registration.js"]
    depends_on:
      - prometheus
    # up으로 다른 서비스와 함께 자동 기동되지 않도록 명시적 run 대상으로만 사용한다.
    profiles:
      - run

volumes:
  prometheus_data:
