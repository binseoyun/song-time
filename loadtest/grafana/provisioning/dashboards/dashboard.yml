# 이 폴더(dashboards/)에 있는 JSON 파일을 Grafana가 기동 시 자동으로 읽어들인다.
# 데이터소스 자동 등록(../datasources/prometheus.yml)과 같은 원칙 — 수동 클릭 없이
# 컨테이너가 뜨자마자 대시보드가 이미 구성돼 있어야 한다(ADR-006 4.2).
apiVersion: 1

providers:
  - name: loadtest
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10 # 실험 중 JSON을 고치면 10초 안에 반영됨
    options:
      path: /etc/grafana/provisioning/dashboards
