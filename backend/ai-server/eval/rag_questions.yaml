#   RAG 코퍼스 = 업로드된 PDF만. 없는 과목의 강의계획서 질문은 "미등록"이 정답.
#
# -----------------------------------------------------------------------------
# 스키마
# -----------------------------------------------------------------------------
#   id                : rag-NN
#   category          : 의미검색 | 미등록 | 범위밖
#   question          : 사용자 발화
#   expect_course_code: 정답 과목코드(의미검색). 배열이면 "여러 과목 다 맞음"
#   expect_kind       :
#       hit           = search_syllabus top-k에 expect_course_code가 들어와야 함
#       not_registered= 그 과목 강의계획서가 코퍼스에 없음 → 에이전트는 "등록 안 됨"이라
#                       답해야 하고 개요·평가·주차별을 지어내면 안 됨(할루시네이션)
#       out_of_scope  = 정확한 값(잔여석·정원 등) 질문 → search_syllabus/get_syllabus를
#                       부르면 "RAG 오선택". get_course_by_code / search_courses가 정답 경로
#   answer_must_not_include : [문자열,...] 최종 답변에 있으면 실패 (미등록 케이스 할루시네이션 감지)
