# =============================================================================
# AI 챗봇 Tool 라우팅 정확도 — 질문 세트 (이슈 #74 / 재작성 #111, ADR-010 §8/§14)
# =============================================================================
# 74 시나리오. 라벨(expect_*)은 seedData.js(소프트웨어학부 2026-2, 22과목/37분반 — #89)
# 실측값 대조. #111에서 재시딩에 맞춰 전면 재작성(구 92과목 세트 → 신규 세트).
#
# 에이전트 Tool 4개 (RAG 2개는 rag_questions.yaml에서 별도 채점):
#   search_courses(keyword)   : 과목명/학과명/교수명에 keyword가 든 과목 목록.
#                               각 과목에 remaining_seats(실시간 잔여석·Redis),
#                               registered_count(실시간 신청자 수), interest_count(관심 등록 수).
#   get_course_by_code(code)  : 과목 코드로 단건 상세(교수/시간표/좌석)
#   search_syllabus / get_syllabus : 강의계획서(Qdrant) — 이 세트에선 부르면 안 되는 경우만 확인
#
# 잔여석/분반비교 시나리오는 실시간 좌석(Redis)을 기준으로 하며, 재현 시
#   seedAllClassSeats.js → seedBenchmarkSeats.js 순으로 실행한다(ADR-013).
#
# -----------------------------------------------------------------------------
# 스키마
# -----------------------------------------------------------------------------
#   id        : <카테고리약자>-NN
#   category  : 과목검색 | 코드조회 | 잔여석 | 분반비교 | 모호 | 범위밖 | 멀티턴
#   note      : 이 질문이 노리는 것 / 라벨 근거
#   turns[] :
#     user                    : 사용자 발화
#     expect_tool             : search_courses | get_course_by_code | none | any | ignore
#         none   = Tool 부르면 안 됨 (거절 / "화면에서 직접" 유도가 정답)
#         any    = 뭐든 하나는 불러야 함 (종류 안 따짐)
#         ignore = Tool 차원 채점 안 함 (멀티턴 후속처럼 히스토리로 답해도 정답)
#     expect_args             : {인자: 부분문자열}. 구체 Tool일 때만. 공백 접어서 비교
#     answer_must_include     : [문자열,...] 최종 답변에 전부 있어야 통과 (교수명 등 안정값 위주)
#     answer_must_not_include : [문자열,...] 하나라도 있으면 실패 (할루시네이션 감지)
#
# -----------------------------------------------------------------------------
# 시드 데이터 참조값 (검수 시 재확인 — 연습 앱으로 신청 돌렸으면 db 볼륨 초기화 후 측정)
# -----------------------------------------------------------------------------
#   전 과목 department='소프트웨어학부' → keyword "소프트웨어"는 학과명에 걸려 37분반 전체 반환
#   교수명은 과목명(name)에 없지만 search_courses가 professor도 매칭한다(#82)
#   존재하지 않는 과목(할루시네이션 테스트용): 운영체제, 자료구조, 컴파일러, 클라우드시스템
#
#   분반 다수(같은 코드):
#     디지털논리회로 21001710-1/2 (정영주)
#     알고리즘 21000549-1/2 (안태훈)
#     경영정보시스템 21001083-1/2/3/4/5 (서보밀 1·3 / 한은정 2·4·5)
#     데이터베이스설계와질의 21003183-1/2/3 (심준호)
#     리눅스시스템 21001713-1/2 (창병모)
#     자바프로그래밍 21000557-1/2/3 (박숙영 1·2 / 이현자 3)
#     컴퓨터네트워크Ⅰ 21003186-1/2 (김윤희)
#     컴퓨터수학 21002147-1/2/3 (채희준 / 김선필 / 최영우)
#     프로그래밍개론 21002144-1/2 (박수현 / 조선영)
#
#   한 교수 여러 과목:
#     정영주(디지털논리회로·영상정보처리) / 유석종(소프트웨어의이해·컴퓨터그래픽스)
#     박숙영(모바일소프트웨어·자바프로그래밍 1·2) / 심준호(데이터베이스설계와질의 3분반)
#     창병모(리눅스시스템 2분반) / 김윤희(컴퓨터네트워크Ⅰ 2분반)
#     박영훈(네트워크보안·학생개설:블록체인) / 조선영(데이터사이언스응용·프로그래밍개론-2)
#     이현자(논리및논술(정보·컴퓨터)·자바프로그래밍-3·정보·컴퓨터교재연구및지도법)
#
#   이름 겹침(모호 — keyword가 서로 다른 과목명에 매칭):
#     "네트워크"→네트워크보안+컴퓨터네트워크Ⅰ / "논리"→디지털논리회로+논리및논술
#     "데이터"→데이터베이스설계와질의+데이터사이언스응용
#     "시스템"→경영정보시스템+리눅스시스템
#     "프로그래밍"→자바프로그래밍+프로그래밍개론
#     "컴퓨터"→컴퓨터네트워크Ⅰ+컴퓨터수학+컴퓨터그래픽스+컴퓨터특강
#     "정보"→경영정보시스템+논리및논술(정보·컴퓨터)+영상정보처리+정보·컴퓨터교재연구및지도법
#
#   관심 등록(Class.enrolled)이 정원과 같은 분반(수업 목록 UI "N/N명"):
#     디지털논리회로 1·2 / 알고리즘-2 / 경영정보시스템-4 / 딥러닝개론 / 소프트웨어공학 /
#     인공지능산업체특강 / 자바프로그래밍 2·3 / 프로그래밍개론 1·2
#
#   실시간 잔여석 픽스처(seedBenchmarkSeats.js) — 아래 시나리오가 참조하는 값:
#     소프트웨어의이해 21003917-1: 12   | 영상정보처리 21003187-1: 25
#     네트워크보안 21002031-1: 17       | 데이터사이언스응용 21105803-1: 33
#     모바일소프트웨어 21003757-1: 8    | 컴퓨터특강 21003761-1: 27
#     딥러닝개론 21105625-1: 15         | 인공지능산업체특강 21105589-1: 10
#     소프트웨어공학 21000555-1: 23
#     데이터베이스설계와질의 21003183-1/2/3: 40 / 3 / 22   (최다 = -1)
#     자바프로그래밍 21000557-1/2/3: 25 / 4 / 12           (최다 = -1 박숙영, 신청자 -2=36 -3=28)
#     컴퓨터수학 21002147-1/2/3: 30 / 12 / 4               (최다 = -1 채희준)
#     경영정보시스템 21001083-1/2/3/4/5: 8 / 30 / 2 / 15 / 22  (최다 = -2 한은정)
#     컴퓨터네트워크Ⅰ 21003186-1/2: 5 / 28                (최다 = -2)
#     리눅스시스템 21001713-1/2: 6 / 35                    (최다 = -2)
#     디지털논리회로 21001710-1/2: 18 / 3                  (최다 = -1)
#     알고리즘 21000549-1/2: 15 / 15                       (동률)
#     프로그래밍개론 21002144-1/2: 9 / 40                  (최다 = -2, 오전 분반)
#   픽스처에 없는 과목의 Redis 잔여석은 seedAllClassSeats.js 직후 값(대부분 정원=잔여석).
# =============================================================================


