# =============================================================================
# AI 챗봇 Tool 라우팅 정확도 — 질문 세트 (이슈 #74, ADR-010 §8/§14)
# =============================================================================
# 카테고리 7종 x 10개 = 70 시나리오. 라벨(expect_*)은 seedData.js(2026-08-26) 대조.
#
# 에이전트 Tool 2개 (RAG는 Stage 1에서 추가):
#   search_courses(keyword)   : 과목명/학과명에 keyword가 든 과목들의 잔여석 목록
#                               (전 과목 department가 '컴퓨터공학' 한 값이라 사실상 과목명 매칭만 유효)
#   get_course_by_code(code)  : 과목 코드로 단건 상세(교수/시간표/잔여석)
#
# -----------------------------------------------------------------------------
# 스키마
# -----------------------------------------------------------------------------
#   id        : <카테고리약자>-NN
#   category  : 과목검색 | 코드조회 | 잔여석 | 분반비교 | 모호 | 범위밖 | 멀티턴
#   note      : 이 질문이 노리는 것 / 라벨 근거
#   turns[] :
#     user                    : 사용자 발화
#     expect_tool             : search_courses | get_course_by_code | none | any | ignore
#         none   = Tool 부르면 안 됨 (거절 / "화면에서 직접" 유도가 정답)
#         any    = 뭐든 하나는 불러야 함 (종류 안 따짐)
#         ignore = Tool 차원 채점 안 함 (멀티턴 후속처럼 히스토리로 답해도 정답)
#     expect_args             : {인자: 부분문자열}. 구체 Tool일 때만. 공백 접어서 비교
#     answer_must_include     : [문자열,...] 최종 답변에 전부 있어야 통과 (교수명 등 안정값 위주)
#     answer_must_not_include : [문자열,...] 하나라도 있으면 실패 (할루시네이션 감지)
#
# 시드 데이터 참조값 (검수 시 재확인 — 연습 앱으로 신청 돌렸으면 db 볼륨 초기화 후 측정)
#   존재하지 않는 과목(할루시네이션 테스트용): 운영체제, 자료구조, 컴파일러, 데이터구조
#   전 과목 department='컴퓨터공학'. 교수명은 과목명(name)에 없음 → keyword로 교수 검색 불가
#   자리 0(마감)  : 독일어Ⅰ 21000203-1 (40/40)
#   자리 1        : 클라우드시스템 21003735-1(김윤희·김서영) / 인공지능입문 21105364-1(최윤혁) /
#                   프로그래밍방법론 21003683-1(최윤혁) / 자바프로그래밍 21000557-3(박숙영) /
#                   프로그래밍개론 21002144-3(박수현) / 경영정보시스템 21001083-3(한은정)
#   분반 다수     : 데이터베이스설계와질의 21003183-1/2/3 (심준호, 잔여 20/2/19)
#                   자바프로그래밍 21000557-1/2/3 (창병모/박숙영/박숙영, 잔여 20/3/1)
#                   컴퓨터수학 21002147-1/2/3 (채희준/최영우/최영우, 잔여 44/6/20)
#                   알고리즘 21000549-1/2 (안태훈, 잔여 15/15)
#                   알고리즘입문 21100720-1/2/3 (강지우/강지우/정성훈, 잔여 13/18/28)
#                   공학수학I 21102525-1/2/3 (박화진, 잔여 13/32/8)
#                   컴퓨터그래픽스 21000558-1/2 (정영주, 잔여 5/2)
#                   웹프로그래밍(캡스톤디자인) 21105365-1/2 (김상연, 잔여 4/55)
#                   데이터베이스 21102538-1/2 (박영호, 잔여 2/6)
#   한 교수 여러 과목: 홍기범(파이썬데이터분석·딥러닝개론) / 창병모(리눅스시스템·자바프로그래밍-1) /
#                   박영호(데이터베이스 2분반) / 정영주(컴퓨터그래픽스·영상정보처리) /
#                   강지우(알고리즘입문·센서프로그래밍·졸업프로젝트) / 박화진(공학수학I·AR/VR게임프로그래밍)
#   이름 겹침(모호): "데이터베이스"→데이터베이스설계와질의+데이터베이스 / "알고리즘"→알고리즘+알고리즘입문 /
#                   "딥러닝"→딥러닝개론+딥러닝원리와응용 / "보안"→네트워크보안+시스템보안 /
#                   "네트워크"→네트워크보안+컴퓨터네트워크Ⅰ+네트워크(캡스톤디자인) / "인공지능"→인공지능입문+인공지능산업체특강
# =============================================================================


# ===== 과목검색: 이름/키워드로 목록을 찾는 질문 (search_courses) =====

- id: search-01
  category: 과목검색
  note: "keyword가 여러 과목명에 걸림 — 목록 반환 기대"
  turns:
    - user: "이번 학기에 데이터베이스 관련된 과목 뭐뭐 있어?"
      expect_tool: search_courses
      expect_args: { keyword: "데이터베이스" }

- id: search-02
