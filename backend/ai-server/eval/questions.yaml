  note: "딥러닝개론 / 딥러닝원리와응용 둘 다 매칭"
  turns:
    - user: "딥러닝 들어가는 수업 알려줘"
      expect_tool: search_courses
      expect_args: { keyword: "딥러닝" }

- id: search-03
  category: 과목검색
  note: "교수명은 name에 없음 → keyword='심준호'면 빈 결과. 전체 조회 후 필터가 이상적. Tool 설계 한계 노출용 — 라벨은 search_courses 호출 자체까지만 요구"
  turns:
    - user: "심준호 교수님 수업 뭐뭐 하셔?"
