    professor: "신승준"
    professor_email: "seungjun@sookmyung.ac.kr"
    department: "소프트웨어학부"
    credits: 3
    method: "대면"
    teaching_methods: ["발표", "문제풀이", "실습", "컴퓨터보조학습"]
    prerequisites: ""
    textbook: "스노우보드에 주차별 강의안 업로드 예정"
    reference: "임순범·이상환, 『인공지능 시대의 IT기술의 이해』, 생능출판사"
    exam_schedule: "중간평가(필기) 8주차, 기말평가(팀프로젝트 최종 발표) 15주차"
    overview: >
      인공지능(AI) 및 기계학습(ML) 기술의 실무 활용 능력을 함양하기 위해 클라우드
      환경에서의 데이터 분석과 AI모델을 학습한다. 최신 클라우드 플랫폼과 도구를
      이용한 실습과 프로젝트를 수행하며, 기업 실무 엔지니어·산업체 전문가와 함께
      프로젝트 기획·설계·수행 및 구현의 모든 단계에서 집중 멘토링을 제공한다.
      Azure 클라우드 실습과 연계되며, 이 수업을 이수한 학생을 대상으로 여름방학에
      국제 공인 인증 시험인 AI900 자격증 과정을 진행할 예정이다.
    objectives: >
      1. 기초 역량 습득: MS Azure를 활용하여 클라우드 플랫폼 및 실무에서 많이
      사용되는 주요 머신러닝 모델을 학습. 2. 프로젝트 기획 및 설계: 기업의 실전
      문제와 해결 사례 학습, 프로젝트 주제 선정 및 활용할 AI리소스를 정의.
      3. 프로젝트 수행 및 멘토링: 실무 엔지니어와 함께 연계 기업의 문제를 해결하는
      프로젝트를 구현하며 산업체 전문가의 집중 멘토링을 받음. 4. 결과 발표 및
      평가: 팀 프로젝트 결과물을 발표하고 산업체 전문가로부터 기술 동향 연계
      피드백을 받음. 5. 교내 SW중심대학사업단과 협력하여 대내외 경진대회에 참여.
    grading:
      - {type: "캡스톤디자인 과정평가", weight: 15}
      - {type: "프로젝트 수행계획서 및 결과보고서", weight: 30}
      - {type: "중간평가", weight: 20}
      - {type: "기말평가", weight: 20}
      - {type: "출석", weight: 15}
    weekly_plan:
      - {week: 1, theme: "Cloud & Azure cloud 소개 (Cloud Computing, MS Azure Resource Group·ML Studio 리소스 생성)"}
      - {week: 2, theme: "Azure ML Designer 분류 모델 (Classification, Random Forest, NASA 데이터 로켓 발사 예측)"}
      - {week: 3, theme: "Azure ML Designer 회귀 모델 (Regression, Linear/Multiple Linear Regression, 자전거 수요 예측)"}
      - {week: 4, theme: "Azure ML Designer 군집 모델 (Clustering, K-means, KBO 데이터 최고타자 예측)"}
      - {week: 5, theme: "Pytorch 전이학습 (Perceptron, MLP, CNN, ResNet50, 이미지 분류 CNN 모델)"}
      - {week: 6, theme: "Cloud and Data Science Industry Trend 특강 (Early in Career, 멀티 클라우드 아키텍처와 외국계 취업 가이드)"}
      - {week: 7, theme: "Azure Custom Vision 이미지 AI 모델 (개체 감지, 이미지 분류)"}
      - {week: 8, theme: "중간고사"}
      - {week: 9, theme: "Microsoft Azure OpenAI (1) — OpenAI 및 알고리즘 기초, 자연어 처리 기초, Azure OpenAI 챗봇 구현"}
      - {week: 10, theme: "Microsoft Azure OpenAI (2) — Azure OpenAI RAG 모델 구현 (1)"}
      - {week: 11, theme: "Microsoft Azure OpenAI (3) — Azure OpenAI RAG 모델 구현 (2)"}
      - {week: 12, theme: "Team Project (1) — Azure 내 AI Resource 활용 팀 프로젝트 및 멘토링"}
      - {week: 13, theme: "Team Project (2)"}
      - {week: 14, theme: "Team Project (3)"}
      - {week: 15, theme: "기말평가 (팀프로젝트 발표)"}
