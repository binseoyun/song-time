    reference: "R. Pressman & B. Maxim, Software Engineering: A Practitioner's Approach, 9th ed. (McGraw-Hill, 2020); 최은만, 『소프트웨어공학의 모든것』 개정판, 생능출판, 2025"
    exam_schedule: "중간고사 8주차 (10/21 수), 기말고사 15주차 (12/9 수)"
    overview: >
      본 교과목은 대규모 소프트웨어 개발의 전 과정을 체계적으로 이해하고,
      효율적이고 신뢰성 있는 소프트웨어를 개발하기 위한 소프트웨어공학의 기본
      원리와 실무 기법을 학습하는 것을 목표로 한다. 요구사항 분석, 시스템 설계,
      구현, 테스트, 유지보수 및 프로젝트 관리 등 소프트웨어 생명주기의 각 단계를
      다루며, 객체지향 분석 및 설계, UML, 소프트웨어 아키텍처, 애자일
      개발방법론, 형상관리, 품질보증 등의 핵심 내용을 학습한다. 다양한 사례와
      팀 프로젝트를 통해 실무 중심의 문제 해결 능력과 협업 능력을 배양한다.
    objectives: >
      1. 소프트웨어공학의 기본 개념과 개발 생명주기를 이해하고, 소프트웨어 개발
      프로세스와 공학적 개발 방법을 설명할 수 있다. 2. 요구사항 분석 및 객체지향
      설계 능력을 배양하고 UML을 활용하여 시스템을 모델링할 수 있다. 3. 소프트웨어
      구현 및 품질 확보 기법을 습득하여 테스트·디버깅·리팩토링 및 형상 관리
      기법을 적용해 품질을 향상시킬 수 있다. 4. 애자일 개발방법론과 프로젝트 관리
      기법을 이해하고 팀 프로젝트를 수행해 소프트웨어 프로젝트 관리 및 협업 능력을
      함양한다. 5. DevOps, CI/CD, 생성형 AI 기반 개발도구(GitHub Copilot, ChatGPT
      등) 등 최신 소프트웨어개발 기술의 활용 방법을 이해하고 적용할 수 있다.
    grading:
