    source_pdf: ["네트워크보안.pdf"]

  - course_code: "21001710"
    class_no: ["2"]
    course_name: "디지털논리회로"
    professor: "정영주"
    professor_email: "yjeong@sookmyung.ac.kr"
    department: "소프트웨어학부"
    credits: 3
    method: "대면"
    teaching_methods: ["세미나"]
    prerequisites: ""
    textbook: "디지털 논리회로 (김종현 지음)"
    reference: ""
    exam_schedule: "중간고사 10/26(월) 18:00-20:30, 기말고사 12/9(수) 18:00-20:30"
    overview: >
      본 과목은 소프트웨어학부생을 위한 전공 기초 과목으로, 컴퓨터 하드웨어의
      핵심인 논리회로의 설계 원리를 학습한다. 이진 시스템과 부울 대수를 시작으로
      조합회로(가산기, MUX)와 순서회로(레지스터, 카운터)의 구조를 체계적으로 다룬다.
    objectives: >
      컴퓨터 하드웨어의 핵심 원리 이해: 디지털 시스템의 기본이 되는 이진 데이터
      표현과 부울 대수의 수학적 원리를 이해한다. 컴퓨터 핵심 부품 설계 능력 배양:
