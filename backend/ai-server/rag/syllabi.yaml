      - {type: "과제2", weight: 15}
      - {type: "과제3", weight: 15}
      - {type: "중간고사", weight: 30}
      - {type: "기말고사", weight: 30}
    weekly_plan:
      - {week: 1, theme: "강의 소개, 프로젝트 내용 및 팀구성 안내 / SE 개요 — 소프트웨어개발 환경의 변화"}
      - {week: 2, theme: "소프트웨어개발 프로세스와 방법론 (전통적 프로세스, 애자일: 스크럼·Sprint·Product Backlog, 카오스 엔지니어링과 DevOps)"}
      - {week: 3, theme: "스크럼 시뮬레이션 실습 / 프로젝트 관리 (일정 관리, 개발 비용 추정)"}
      - {week: 4, theme: "소프트웨어 요구 분석 (1) — 요구사항의 수집과 구조화"}
      - {week: 5, theme: "소프트웨어 요구분석 (2) — 유스케이스를 이용한 요구 모델링"}
      - {week: 6, theme: "객체지향방법론 (1) — 정적모델링/동적모델링"}
      - {week: 7, theme: "객체지향방법론 (2) — 제어모델링과 모델검증"}
      - {week: 8, theme: "중간고사"}
      - {week: 9, theme: "소프트웨어 설계원리 — 전통적 설계원리, 객체지향 설계원리 SOLID"}
      - {week: 10, theme: "소프트웨어 아키텍처와 설계패턴 — 아키텍처 스타일, 설계 패턴"}
