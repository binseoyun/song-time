    reference: "Ian Goodfellow·Yoshua Bengio·Aaron Courville, Deep Learning (MIT Press, 2016) — https://www.deeplearningbook.org/"
    exam_schedule: "중간고사 8주차, 기말고사 15주차"
    overview: >
      본 교과목은 과목명이 「딥러닝개론」이지만 개론이 아닌 딥러닝의 심화 이론을
      다루는 수업이다. 딥러닝은 다양한 데이터를 기반으로 신경망(Neural Network)을
      목적에 맞게 학습시키는 인공지능 분야이다. 본 강의에서는 지금까지 배운
      데이터-손실 함수-모델 개념을 넘어, 이를 보다 정확히 이해하고 전문성을
      심화할 수 있도록 근본적인 딥러닝 이론과 원리를 다룬다. 이전에 진행한
      「생성형 AI의 이해」 수업과 마찬가지로 이론적 내용과 수식 기반의 증명이
      주요 학습 내용이다.
    objectives: >
      딥러닝에 관한 전반적인 학문에 대한 심도있는 이해. 특수한 모델링에 국한되지
      않은 일반적인 딥러닝 이론적 지식 이해. 딥러닝에 관한 기본적인 연구부터
      최신 연구까지의 폭넓은 이해.
