    reference: "William Stallings 저 / 이재광·전태일 공역, 『네트워크 보안 에센셜』 6판, 진샘미디어"
    exam_schedule: "중간고사 10/20(화) 수업시간, 기말고사 12/10(목) 수업시간 (오프라인)"
    overview: >
      컴퓨터 및 네트워크에서 사용되고 있는 보안 기술을 소개한다.
    objectives: >
