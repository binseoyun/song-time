    course_name: "데이터베이스설계와질의"
    professor: "심준호"
    professor_email: "jshim@sookmyung.ac.kr"
    department: "소프트웨어학부"
    credits: 3
    method: "대면"
    teaching_methods: ["질의응답", "초청강의", "유인물", "OHP"]
    prerequisites: "자료구조, 프로그래밍 기초 과목"
    textbook: "R. Ramakrishnan & J. Gehrke, Database Management Systems, 3rd ed. (McGraw-Hill, 2003) — lecture notes 제공"
    reference: "김수희·김응모 외 공역, 『데이터베이스 시스템』"
    exam_schedule: "중간시험 8주차 금요일(2026.10.23) 15:00-16:30, 기말시험 15주차 금요일(2026.12.11) 15:00-16:30 (1·2·3반 동일 시간)"
    overview: >
      데이터베이스 시스템의 구성과 데이터베이스 모델 기법의 대표적인 ER 모델링,
      정규화 등에 대해 학습한다. 관계형 데이터베이스(relational database) 설계와
      대표적 질의어인 SQL, 그리고 이의 이론적 배경인 관계형 대수에 대해 배우고,
      무결성규칙(integrity constraint), 트랜잭션 프로세싱 개념 등을 포함해
      데이터베이스 시스템의 기본 개념에 대한 이론적 체계를 다진다.
    objectives: >
      (1) 데이터베이스와 데이터베이스 시스템에 대한 기초 이론을 습득한다.
      (2) 데이터베이스 설계의 요구 사항 분석과 설계과정, 대표적 개념적 모델링
      기법인 ER(Entity Relationship) 모델링을 학습한다. (3) 관계형 모델과 대표적인
      질의어인 SQL을 익힌다. (4) 컴퓨터전공자로서 데이터베이스 시스템에 대한
      이해를 위해 트랜잭션 프로세싱, 동시성제어, 회복 복구기법 등을 학습하고
      관계데이터베이스 정규화 이론을 학습한다.
    grading:
      - {type: "중간시험", weight: 45}
      - {type: "기말시험", weight: 50}
      - {type: "과제 및 수업참여도", weight: 5}
    weekly_plan:
      - {week: 1, theme: "교육 목표·교과내용·일정 소개 / 데이터베이스와 DBMS 전반 소개"}
      - {week: 2, theme: "개념적 설계 (conceptual design)"}
      - {week: 3, theme: "ER 모델링"}
      - {week: 4, theme: "논리적 설계 (logical design)와 관계형 모델 (relational model)"}
      - {week: 5, theme: "관계대수 (relational algebra)"}
      - {week: 6, theme: "SQL 질의어 (1)"}
      - {week: 7, theme: "SQL 질의어 (2)"}
      - {week: 8, theme: "중간고사"}
      - {week: 9, theme: "SQL 질의어 (3)"}
      - {week: 10, theme: "트랜잭션 프로세싱 개념 (1)"}
      - {week: 11, theme: "트랜잭션 프로세싱 개념 (2) / DBMS 산업계 기술 동향"}
      - {week: 12, theme: "동시성 제어 (concurrency control)"}
      - {week: 13, theme: "회복 복구 (recovery)"}
      - {week: 14, theme: "정규화 (normalization)"}
      - {week: 15, theme: "기말고사"}
    source_pdf: ["데베설.pdf"]

