# 통합 테스트 전용 MySQL. 개발용 DB(루트 compose, 3310)와 분리해 3311에 띄운다.
# 데이터는 tmpfs(메모리)에만 존재 — 컨테이너 내리면 사라지는 일회용 DB.
services:
  test-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: sugang_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "3311:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utest", "-ptest"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 대기열/Active 게이트(이슈 #46) 통합 테스트용 Redis. 개발용 Redis(루트 compose, 6379)와
  # 분리해 6380에 띄운다. 데이터는 휘발성으로 충분 — 컨테이너 내리면 사라져도 무방하다.
  test-redis:
    image: redis:7.4-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
