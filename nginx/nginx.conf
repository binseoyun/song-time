# nginx:alpine 이미지 기본 nginx.conf를 우리가 직접 관리하도록 전체 교체.
# 목적: events{} 블록의 worker_connections는 http{} 밖(conf.d에서는 손댈 수 없는 위치)에
# 있어서, default.conf(conf.d 조각)만으로는 절대 못 바꾼다 — 최상위 파일 자체를 통째로
# 가져와야 한다.
#
# worker_connections 1024(기본값) → 16384로 상향한 근거(doc/troubleshooting/05 참고):
# 워커 프로세스 수(이 환경 기준 2, CPU 2개 auto) × worker_connections = 총 커넥션 슬롯.
# 요청 1건당 슬롯 2개(클라이언트+업스트림)를 쓰므로, 기존 1024면 실질 동시 처리 약 1,024건.
# Group C 어뷰징 시나리오(macro, VUS=12,000 × 5개 동시발사)에서 Prometheus로 실측한
# 순간 최대 처리 속도가 35,760 req/s였다 — 이 실측치를 명확히 커버하도록 16배 상향했다
# (무작정 최댓값을 잡지 않고, 실측된 최악의 부하를 기준으로 역산).
user  nginx;
worker_processes  auto;

worker_rlimit_nofile 32768;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  16384;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
