# ADR-003: docker-compose에서 frontend/backend/ai-server를 하나의 origin으로 묶는 리버스 프록시.
# K8s의 Ingress(K8s/45-ingress.yaml)와 같은 경로 규칙을 그대로 맞춘다.

# backend를 upstream으로 승격시켜 keepalive 커넥션 풀을 유지한다(doc/troubleshooting/05 1순위).
# 기존엔 proxy_pass로 매 요청마다 nginx↔backend TCP를 새로 맺고 끊었는데, 어뷰징 시나리오
# (VUS=12,000 × 5개 동시발사 = 60,000요청 순간 도착)에서 이 반복적인 3-way handshake
# 자체가 무시 못 할 비용이었다.
#
# keepalive 64 → 2048로 재상향(이슈 #57, 2026-08-20): 64는 "한 번에 몰리는 순간 폭발"
# (레지스트레이션 API 단발 스파이크) 기준으로 튜닝된 값이었다. 대기열 Valve Tuning
# 실험(12,000명이 3~5초 주기로 몇 분간 지속 폴링)처럼 "동시에 오래 유지되는 연결 수"가
# 많은 부하 패턴에서는 전혀 다른 병목이 된다 — 실측 시 nginx 에러 로그에
# "upstream timed out while connecting to upstream"이 반복됐는데, 이는 backend가
# 느려서가 아니라(Redis Lua 호출은 수 ms) nginx→backend 재사용 가능 커넥션 풀 자체가
# 부족해 새 연결조차 못 맺은 것이었다. worker_connections(16384, nginx.conf)에 맞춰
# 함께 상향한다.
#
# backend_1/backend_2 두 인스턴스를 명시적으로 나열한다(doc/troubleshooting/05 2순위).
# `--scale`로 늘린 레플리카를 `server backend:8000;` 하나로 참조하면 안 되는 이유:
# 오픈소스 nginx는 이 호스트명을 시작 시점에 딱 한 번만 DNS로 resolve하고 캐싱한다
# (동적 재조회는 유료판의 resolver 기능 또는 별도 설정이 필요). 즉 레플리카가 여러 개
# 떠도 nginx는 그중 먼저 resolve된 IP 하나로만 계속 보낼 수 있어, 실제로는 부하분산이
# 안 될 위험이 있다. 서비스 이름을 각각 명시하면 이 문제 자체가 생기지 않는다 — nginx
# 기본 알고리즘(라운드로빈)이 backend_1/backend_2를 번갈아 사용한다.
upstream backend_pool {
    # max_fails/fail_timeout 명시(이슈 #57, 2026-08-20): nginx 기본값(max_fails=1
    # fail_timeout=10s)은 백엔드가 단 한 번만 연결 실패해도 그 인스턴스를 10초간
    # "죽었다"고 간주해 풀에서 뺀다. 폴링 부하로 순간적인 커넥션 지연이 backend_1/
    # backend_2 양쪽에 거의 동시에 한 번씩만 튀어도, 둘 다 죽은 걸로 판정돼
    # "no live upstreams"(요청 전부 즉시 실패)로 이어지는 걸 실측으로 확인했다 —
    # 실제로는 두 backend 모두 CPU 25~44% 수준으로 멀쩡히 살아있었다. 진짜 장애와
    # 일시적 지연을 구분하도록 완화한다.
    server backend_1:8000 max_fails=10 fail_timeout=3s;
    server backend_2:8000 max_fails=10 fail_timeout=3s;
    keepalive 2048;
}

server {
    listen 80;

    # 스케줄러(AI 시간표 생성)는 backend를 거치지 않고 ai-server가 직접 처리 —
    # /api/ 보다 먼저 매칭돼야 하므로 더 구체적인 경로로 둔다.
    location /api/schedule {
        proxy_pass http://ai-server:5000/api/schedule;
    }

    location /api/ {
        proxy_pass http://backend_pool/api/;
        # keepalive는 HTTP/1.1부터 지원. Connection 헤더를 비워야 nginx가 기본으로 붙이는
        # "Connection: close"가 backend로 안 나가서 실제로 커넥션이 재사용된다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 기본 60초로도 이번 문제(연결 자체가 안 맺어짐)는 못 가리지만, 폴링 부하 특성상
        # 순간적으로 몰릴 때 여유를 조금 더 준다(이슈 #57).
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://frontend:3000/;
    }
}
